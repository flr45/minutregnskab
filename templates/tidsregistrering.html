<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#007BFF" />

  <link
    rel="manifest"
    href="{{ url_for('static', filename='manifest.json') }}"
  />

  <title>Tidsregistrering</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f8;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      background: #007BFF;
      color: #fff;
      text-align: center;
      padding: 15px;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.5em;
    }

    header span {
      display: block;
      font-size: 0.9em;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
      padding: 15px;
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .row label {
      flex: 1;
      font-weight: bold;
    }

    .row input[type="time"] {
      flex: 2;
      min-width: 0;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #007BFF;
      color: #fff;
      cursor: pointer;
    }

    button.nu-knap {
      background: #28a745;
      margin-left: 5px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    th {
      background: #007BFF;
      color: #fff;
    }

    td input[type="time"] {
      width: 100%;
      min-width: 0;
    }

    .a-tid {
      background: #d4edda;
    }

    .b-tid {
      background: #d1ecf1;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #007BFF;
      z-index: 10;
    }

    .bottom-bar button {
      flex: 1;
      padding: 15px 5px;
      font-size: 1em;
      border-radius: 0;
    }

    #btnOpdater {
      background: #6c757d;
    }

    .ny-knap {
      background: #ffc107;
      color: #000;
    }

    .pause-group {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 10px;
    }

    .pause-group > div {
      flex: 1;
    }

    #sum b {
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .container {
        padding: 8px;
      }

      .card {
        padding: 12px;
      }

      th,
      td {
        padding: 4px 2px;
        font-size: 0.85em;
      }

      .bottom-bar button {
        font-size: 0.9em;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Tidsregistrering</h1>
  <span id="visDato"></span>
  <span id="vagtStartVis">Vagtstart: –</span>
</header>

<div class="container" id="altIndhold">

  <div class="card">
    <input
      type="text"
      id="beredskab"
      placeholder="Beredskabsnavn"
      onchange="gemData()"
    />

    <div class="row">
      <label for="starttid">Starttid</label>

      <input
        type="time"
        id="starttid"
        onchange="gemData()"
      />

      <button
        type="button"
        class="nu-knap"
        onclick="indsætNu('starttid')"
      >
        Nu
      </button>
    </div>

    <div class="row">
      <label for="sluttid">Sluttid</label>

      <input
        type="time"
        id="sluttid"
        onchange="gemData()"
      />

      <button
        type="button"
        class="nu-knap"
        onclick="indsætNu('sluttid')"
      >
        Nu
      </button>
    </div>

    <button
      type="button"
      id="gemTurBtn"
      disabled
      onclick="tilføjTur()"
    >
      Gem tur
    </button>
  </div>

  <div class="card">
    <table id="turTabel">
      <thead>
        <tr>
          <th>Start</th>
          <th>Slut</th>
          <th>Total</th>
          <th>A-tid</th>
          <th>B-tid</th>
          <th>Slet</th>
        </tr>
      </thead>
      <tbody id="turTabelIndhold"></tbody>
    </table>
  </div>

  <div class="card">
    <label for="fremskudtPause">Fremskudt pause</label>

    <select
      id="fremskudtPause"
      onchange="opdaterTabel()"
    >
      <option value="0">Ingen</option>
      <option value="30">30 min</option>
      <option value="60">60 min</option>
    </select>

    <div class="pause-group">

      <div>
        <strong>Pause 1</strong><br />

        <label>
          <input
            type="radio"
            name="pause1"
            value="Afbrudt"
            onclick="toggleRadio(this)"
          />
          Afbrudt
        </label>

        <br />

        <label>
          <input
            type="radio"
            name="pause1"
            value="Ikke afholdt"
            onclick="toggleRadio(this)"
          />
          Ikke afholdt
        </label>
      </div>

      <div>
        <strong>Pause 2</strong><br />

        <label>
          <input
            type="radio"
            name="pause2"
            value="Afbrudt"
            onclick="toggleRadio(this)"
          />
          Afbrudt
        </label>

        <br />

        <label>
          <input
            type="radio"
            name="pause2"
            value="Ikke afholdt"
            onclick="toggleRadio(this)"
          />
          Ikke afholdt
        </label>
      </div>

    </div>
  </div>

  <div class="card">
    <p id="sum">
      <b>Total:</b> 0 min |
      <b>A-tid:</b> 0 min |
      <b>B-tid:</b> 0 min
    </p>

    <p id="ekstra">
      1–4 minutter: 0 min (0 min)
    </p>

    <p id="overtid">
      Overtid: 0 min
    </p>
  </div>

</div>

<div class="bottom-bar">
  <button type="button" id="btnOpdater">
    ↻ Opdater
  </button>

  <button type="button" onclick="gemSomBillede()">
    📷 Gem billede
  </button>

  <button
    type="button"
    class="ny-knap"
    onclick="nyVagt()"
  >
    🗑 Ny vagt
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  let ture = [];
  let aStart = null;
  let vagtStartDato = null;

  window.addEventListener("load", () => {
    const mødetid = localStorage.getItem("tidsregistreringMødetid");
    const vagtDato = localStorage.getItem("tidsregistreringVagtDato");

    if (mødetid) {
      aStart = minTid(mødetid);
    }

    if (vagtDato) {
      vagtStartDato = new Date(vagtDato);
    }

    visDato();
    hentData();
    updateGemTurBtn();

    document.getElementById("btnOpdater").onclick = () => {
      location.reload();
    };
  });

  function updateGemTurBtn() {
    document.getElementById("gemTurBtn").disabled = aStart === null;
  }

  function visDato() {
    const nu = new Date();

    document.getElementById("visDato").innerText =
      nu.toLocaleDateString("da-DK", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    const vagtStartElement = document.getElementById("vagtStartVis");

    if (aStart !== null && vagtStartDato) {
      const timer = String(Math.floor(aStart / 60)).padStart(2, "0");
      const minutter = String(aStart % 60).padStart(2, "0");

      const dato = vagtStartDato.toLocaleDateString("da-DK", {
        day: "numeric",
        month: "long"
      });

      vagtStartElement.innerText =
        `Vagtstart: ${dato} kl. ${timer}:${minutter}`;
    } else {
      vagtStartElement.innerText = "Vagtstart: –";
    }
  }

  function indsætNu(id) {
    document.getElementById(id).value =
      new Date().toTimeString().slice(0, 5);

    gemData();
  }

  function nyVagt() {
    if (!confirm("Start ny vagt og nulstil alt?")) {
      return;
    }

    const mødetid = prompt("Vagtstart (HH:MM)", "07:30");

    if (!erGyldigTid(mødetid)) {
      alert("Ugyldigt format. Brug HH:MM, for eksempel 07:30.");
      return;
    }

    localStorage.setItem(
      "tidsregistreringMødetid",
      mødetid
    );

    aStart = minTid(mødetid);

    const [timer, minutter] = mødetid
      .split(":")
      .map(Number);

    vagtStartDato = new Date();
    vagtStartDato.setHours(
      timer,
      minutter,
      0,
      0
    );

    localStorage.setItem(
      "tidsregistreringVagtDato",
      vagtStartDato.toISOString()
    );

    ture = [];

    document
      .querySelectorAll('input[type="time"], input[type="text"]')
      .forEach(element => {
        element.value = "";
      });

    document.getElementById("fremskudtPause").value = "0";

    document
      .querySelectorAll('input[type="radio"]')
      .forEach(radio => {
        radio.checked = false;
        radio.dataset.clicked = "";
      });

    gemData();
    opdaterTabel();
    visDato();
    updateGemTurBtn();
  }

  function erGyldigTid(tid) {
    if (!tid || !/^\d{2}:\d{2}$/.test(tid)) {
      return false;
    }

    const [timer, minutter] = tid
      .split(":")
      .map(Number);

    return (
      timer >= 0 &&
      timer <= 23 &&
      minutter >= 0 &&
      minutter <= 59
    );
  }

  function tilføjTur() {
    if (aStart === null) {
      alert(
        "Du skal først vælge din vagtstart. Tryk på 'Ny vagt'."
      );
      return;
    }

    const start = document.getElementById("starttid").value;
    const slut = document.getElementById("sluttid").value;

    if (!start || !slut) {
      alert("Udfyld start- og sluttid.");
      return;
    }

    ture.push({
      start,
      slut
    });

    document.getElementById("starttid").value = "";
    document.getElementById("sluttid").value = "";

    gemData();
    opdaterTabel();
  }

  function minTid(tid) {
    const [timer, minutter] = tid
      .split(":")
      .map(Number);

    return timer * 60 + minutter;
  }

  function beregnAB(startTid, slutTid) {
    let startAbsolut =
      startTid >= aStart
        ? startTid
        : startTid + 1440;

    let slutAbsolut =
      slutTid >= aStart
        ? slutTid
        : slutTid + 1440;

    if (slutAbsolut <= startAbsolut) {
      slutAbsolut += 1440;
    }

    const vagtSlut = aStart + 1440;

    let total = 0;
    let aTid = 0;
    let bTid = 0;
    let overtid = 0;

    for (
      let minut = startAbsolut;
      minut < slutAbsolut;
      minut++
    ) {
      total++;

      const minutterFraVagtstart =
        minut - aStart;

      if (minut >= vagtSlut) {
        overtid++;
      } else if (minutterFraVagtstart < 960) {
        aTid++;
      } else {
        bTid++;
      }
    }

    return {
      total,
      a: aTid,
      b: bTid,
      overtid
    };
  }

  function opdaterTabel() {
    const scrollY = window.scrollY;
    const tabelIndhold =
      document.getElementById("turTabelIndhold");

    tabelIndhold.innerHTML = "";

    const sum = {
      total: 0,
      a: 0,
      b: 0,
      overtid: 0
    };

    ture.forEach((tur, index) => {
      const startTid = minTid(tur.start);
      const slutTid = minTid(tur.slut);

      const resultat =
        beregnAB(startTid, slutTid);

      sum.total += resultat.total;
      sum.a += resultat.a;
      sum.b += resultat.b;
      sum.overtid += resultat.overtid;

      const række =
        document.createElement("tr");

      række.innerHTML = `
        <td>
          <input
            type="time"
            value="${tur.start}"
            onchange="redigerTur(${index}, 'start', this.value)"
          />
        </td>

        <td>
          <input
            type="time"
            value="${tur.slut}"
            onchange="redigerTur(${index}, 'slut', this.value)"
          />
        </td>

        <td>
          <b>${resultat.total}</b>
        </td>

        <td class="a-tid">
          ${resultat.a}
        </td>

        <td class="b-tid">
          ${resultat.b}
        </td>

        <td>
          <button
            type="button"
            aria-label="Slet tur"
            onclick="sletTur(${index})"
          >
            🗑
          </button>
        </td>
      `;

      tabelIndhold.appendChild(række);
    });

    const fremskudtPause =
      Number.parseInt(
        document.getElementById("fremskudtPause").value,
        10
      ) || 0;

    const aTidEfterPause =
      Math.max(sum.a - fremskudtPause, 0);

    const beregnetATid =
      Math.min(aTidEfterPause, 510);

    const beregnetBTid =
      (aTidEfterPause > 510
        ? aTidEfterPause - 510
        : 0) +
      sum.b;

    const beregnetTotal =
      beregnetATid + beregnetBTid;

    document.getElementById("sum").innerHTML = `
      <b>Total:</b> ${beregnetTotal} min |
      <b>A-tid:</b> ${beregnetATid} min |
      <b>B-tid:</b> ${beregnetBTid} min
    `;

    let ekstraMinutter = 0;

    if (beregnetTotal > 720) {
      ekstraMinutter =
        beregnetTotal - 720;
    } else if (beregnetBTid > 210) {
      ekstraMinutter =
        beregnetBTid - 210;
    }

    ekstraMinutter += sum.overtid;

    document.getElementById("ekstra").innerText =
      `1–4 minutter: ${ekstraMinutter} min ` +
      `(${ekstraMinutter * 4} min)`;

    document.getElementById("overtid").innerText =
      `Overtid: ${sum.overtid} min`;

    gemData();
    window.scrollTo(0, scrollY);
  }

  function redigerTur(index, felt, værdi) {
    if (!ture[index]) {
      return;
    }

    ture[index][felt] = værdi;

    gemData();
    opdaterTabel();
  }

  function toggleRadio(element) {
    if (!element.checked) {
      gemData();
      return;
    }

    if (element.dataset.clicked === "true") {
      element.checked = false;
      element.dataset.clicked = "";
    } else {
      document
        .querySelectorAll(`input[name="${element.name}"]`)
        .forEach(radio => {
          radio.dataset.clicked = "";
        });

      element.dataset.clicked = "true";
    }

    gemData();
  }

  function sletTur(index) {
    if (!confirm("Slet tur?")) {
      return;
    }

    ture.splice(index, 1);

    opdaterTabel();
  }

  function gemData() {
    localStorage.setItem(
      "tidsregistrering",
      JSON.stringify({
        ture,
        fremskudt:
          document.getElementById("fremskudtPause").value,
        beredskab:
          document.getElementById("beredskab").value,
        pause1:
          document.querySelector(
            'input[name="pause1"]:checked'
          )?.value || "",
        pause2:
          document.querySelector(
            'input[name="pause2"]:checked'
          )?.value || ""
      })
    );

    localStorage.setItem(
      "tidsregistreringStartSlut",
      JSON.stringify({
        start:
          document.getElementById("starttid").value,
        slut:
          document.getElementById("sluttid").value
      })
    );
  }

  function hentData() {
    try {
      const startSlutData =
        JSON.parse(
          localStorage.getItem(
            "tidsregistreringStartSlut"
          )
        );

      if (startSlutData) {
        document.getElementById("starttid").value =
          startSlutData.start || "";

        document.getElementById("sluttid").value =
          startSlutData.slut || "";
      }

      const gemteData =
        JSON.parse(
          localStorage.getItem("tidsregistrering")
        );

      if (!gemteData) {
        opdaterTabel();
        return;
      }

      ture = Array.isArray(gemteData.ture)
        ? gemteData.ture
        : [];

      document.getElementById(
        "fremskudtPause"
      ).value =
        gemteData.fremskudt || "0";

      document.getElementById(
        "beredskab"
      ).value =
        gemteData.beredskab || "";

      gendanRadio("pause1", gemteData.pause1);
      gendanRadio("pause2", gemteData.pause2);

      opdaterTabel();
    } catch (fejl) {
      console.error(
        "Kunne ikke indlæse gemte data:",
        fejl
      );

      ture = [];
      opdaterTabel();
    }
  }

  function gendanRadio(navn, værdi) {
    if (!værdi) {
      return;
    }

    const radio =
      document.querySelector(
        `input[name="${navn}"][value="${værdi}"]`
      );

    if (radio) {
      radio.checked = true;
      radio.dataset.clicked = "true";
    }
  }

  function gemSomBillede() {
    const indhold =
      document.getElementById("altIndhold");

    html2canvas(indhold, {
      backgroundColor: "#f4f4f8",
      scale: 2
    })
      .then(canvas => {
        const link =
          document.createElement("a");

        link.href =
          canvas.toDataURL("image/png");

        link.download =
          `tidsregistrering_` +
          `${new Date().toISOString().slice(0, 10)}.png`;

        link.click();
      })
      .catch(fejl => {
        console.error(
          "Kunne ikke gemme billedet:",
          fejl
        );

        alert(
          "Billedet kunne ikke gemmes."
        );
      });
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register(
          "{{ url_for('static', filename='service-worker.js') }}"
        )
        .catch(fejl => {
          console.error(
            "Service worker kunne ikke registreres:",
            fejl
          );
        });
    });
  }
</script>

</body>
</html>
