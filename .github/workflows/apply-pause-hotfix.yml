name: Apply pause hotfix

on:
  push:
    branches:
      - fix/pause-auto-resume-and-sticky-interruption
    paths:
      - scripts/apply_pause_hotfix.py
      - .github/workflows/apply-pause-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pause-auto-resume-and-sticky-interruption

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anvend pausehotfix
        run: python scripts/apply_pause_hotfix.py

      - name: Gem rettelsen på branchen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ret automatisk pausevurdering"
          git push origin HEAD:fix/pause-auto-resume-and-sticky-interruption
