name: Test Minutregnskab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installér Python-afhængigheder
        run: pip install -r requirements.txt

      - name: Kontrollér Python-syntaks
        run: python -m compileall -q app.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test beregningsregler
        run: npm test

      - name: Byg Docker-image
        run: docker build -t minutregnskab:test .
